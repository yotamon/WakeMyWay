name: Set up Android build environment
description: Reusable Java, Python, Android SDK, and Gradle setup for WakeMyWay CI

inputs:
  python-version:
    description: Optional Python version. Leave empty to skip Python setup.
    required: false
    default: ""
  setup-android-sdk:
    description: Install the pinned Android SDK platform and build tools.
    required: false
    default: "true"
  setup-gradle:
    description: Configure Gradle caching and build environment.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Python
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Android SDK tools
      if: ${{ inputs.setup-android-sdk == 'true' }}
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: ""
        log-accepted-android-sdk-licenses: "false"

    - name: Install Android 17 SDK
      if: ${{ inputs.setup-android-sdk == 'true' }}
      shell: bash
      run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

    - name: Set up Gradle
      if: ${{ inputs.setup-gradle == 'true' }}
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
