name: Android Release Size Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-release-size-audit.yml"
      - ".github/actions/setup-android/**"
      - "tooling/android_artifact_report.py"
      - "apps/android/app/build.gradle.kts"
      - "apps/android/gradle/libs.versions.toml"
      - "apps/android/app/src/main/res/raw/**"

permissions:
  contents: read

concurrency:
  group: android-release-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android

      - name: Build representative release artifacts
        working-directory: apps/android
        run: ./gradlew :app:assembleDirectRelease :app:bundlePlayRelease --stacktrace

      - name: Measure release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/android/app/build/reports/release-size
          DIRECT_APK="$(find apps/android/app/build/outputs/apk/direct/release -type f -name '*.apk' | head -n 1)"
          PLAY_AAB="$(find apps/android/app/build/outputs/bundle/playRelease -type f -name '*.aab' | head -n 1)"
          test -n "$DIRECT_APK"
          test -n "$PLAY_AAB"
          python tooling/android_artifact_report.py \
            "$DIRECT_APK" "$PLAY_AAB" \
            --json apps/android/app/build/reports/release-size/report.json \
            --markdown apps/android/app/build/reports/release-size/report.md
          cat apps/android/app/build/reports/release-size/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release-size evidence
        uses: actions/upload-artifact@v7
        with:
          name: wake-my-way-release-size-${{ github.sha }}
          path: apps/android/app/build/reports/release-size/**
          if-no-files-found: error
          retention-days: 7
