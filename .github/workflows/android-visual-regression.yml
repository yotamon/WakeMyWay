name: Android Visual Regression

on:
  workflow_call:
  pull_request:
    paths:
      - "apps/android/app/src/main/java/com/wakemyway/app/MainActivity.kt"
      - "apps/android/app/src/main/java/com/wakemyway/app/WakeActivity.kt"
      - "apps/android/app/src/main/java/com/wakemyway/app/character/**"
      - "apps/android/app/src/main/java/com/wakemyway/app/product/**"
      - "apps/android/app/src/main/java/com/wakemyway/app/ui/**"
      - "apps/android/app/src/main/java/com/wakemyway/app/widget/**"
      - "apps/android/app/src/main/res/drawable/**"
      - "apps/android/app/src/main/res/drawable-nodpi/**"
      - "apps/android/app/src/main/res/layout/**"
      - "apps/android/app/src/main/res/mipmap-anydpi-v26/**"
      - "apps/android/app/src/main/res/mipmap-anydpi-v33/**"
      - "apps/android/app/src/main/res/values/**"
      - "apps/android/app/src/main/res/values-v31/**"
      - "apps/android/app/src/main/res/xml/**"
      - "apps/android/app/src/test/**"
      - "apps/android/app/build.gradle.kts"
      - "apps/android/gradle/libs.versions.toml"
      - ".github/actions/setup-android/**"
      - ".github/workflows/android-visual-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - name: Set up Android build environment
        uses: ./.github/actions/setup-android
      - name: Render canonical product states
        run: |
          rm -rf app/src/test/screenshots
          mkdir -p app/src/test/screenshots
          ./gradlew :app:recordRoborazziDirectDebug --stacktrace
      - name: Verify approved visual hashes
        run: |
          cd app/src/test/screenshots
          sha256sum *.png > "$RUNNER_TEMP/wake-my-way-actual.sha256"
          diff -u ../visual-goldens.sha256 "$RUNNER_TEMP/wake-my-way-actual.sha256"
      - name: Upload visual verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wake-my-way-visual-verify-${{ github.sha }}
          path: |
            apps/android/app/src/test/screenshots/**
            apps/android/app/build/outputs/roborazzi/**
            apps/android/app/build/reports/roborazzi/**
            apps/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
