name: Android Device Reliability Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/app/src/main/AndroidManifest.xml"
      - "apps/android/app/src/main/java/com/wakemyway/app/WakeActivity.kt"
      - "apps/android/app/src/main/java/com/wakemyway/app/WakeMyWayApplication.kt"
      - "apps/android/app/src/main/java/com/wakemyway/app/WakeSchedulingGate.kt"
      - "apps/android/app/src/main/java/com/wakemyway/app/WakeSessionViewModel.kt"
      - "apps/android/app/src/main/java/com/wakemyway/app/alarm/**"
      - "apps/android/app/src/main/java/com/wakemyway/app/motion/**"
      - "apps/android/app/src/main/java/com/wakemyway/app/preparation/**"
      - "apps/android/app/src/main/java/com/wakemyway/app/voice/**"
      - "apps/android/app/src/direct/java/com/wakemyway/app/voice/**"
      - "apps/android/app/src/androidTest/**"
      - "apps/android/app/build.gradle.kts"
      - "apps/android/wake-core/**"
      - "apps/android/gradle/libs.versions.toml"
      - ".github/actions/setup-android/**"
      - ".github/scripts/run-android-device-tests.sh"
      - ".github/workflows/android-device-tests.yml"

permissions:
  contents: read

concurrency:
  group: android-device-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Set up Android build environment
        uses: ./.github/actions/setup-android
        with:
          setup-android-sdk: "false"

      - name: Pre-build app and instrumentation APKs
        working-directory: apps/android
        shell: bash
        run: |
          mkdir -p app/build/reports
          set -o pipefail
          ./gradlew :app:assembleDirectDebug :app:assembleDirectDebugAndroidTest --stacktrace 2>&1 | tee app/build/reports/device-prebuild-ci.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run reliability instrumentation on API 36
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash "$GITHUB_WORKSPACE/.github/scripts/run-android-device-tests.sh"

      - name: Upload device-test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wake-my-way-device-test-evidence-${{ github.sha }}
          path: |
            apps/android/app/build/reports/device-prebuild-ci.log
            apps/android/app/build/reports/androidTests/connected/**
            apps/android/app/build/outputs/androidTest-results/connected/**
            adb-devices.txt
            emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 7
