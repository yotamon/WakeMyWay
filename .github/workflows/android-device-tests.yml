name: Android Device Reliability Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feat/m2-device-ci
    paths:
      - "apps/android/**"
      - ".github/workflows/android-device-tests.yml"

permissions:
  contents: read

concurrency:
  group: m2-device-tests
  cancel-in-progress: true

jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Pre-build app and instrumentation APKs
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run reliability instrumentation on API 36
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            set -euo pipefail
            trap 'adb devices -l > "$GITHUB_WORKSPACE/adb-devices.txt" 2>&1 || true; timeout 15s adb logcat -d -t 2000 > "$GITHUB_WORKSPACE/emulator-logcat.txt" 2>&1 || true' EXIT
            cd apps/android
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wake-my-way-device-test-evidence-${{ github.sha }}
          path: |
            apps/android/app/build/reports/androidTests/connected/**
            apps/android/app/build/outputs/androidTest-results/connected/**
            adb-devices.txt
            emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 14
