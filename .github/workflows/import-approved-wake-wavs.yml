name: Import approved WakeMyWay WAV masters

on:
  push:
    branches:
      - "feature/branded-wake-sounds-v2"
    paths:
      - ".github/workflows/import-approved-wake-wavs.yml"

permissions:
  contents: write

jobs:
  import-masters:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/branded-wake-sounds-v2
          fetch-depth: 0

      - name: Download and verify exact approved masters
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(mktemp -d)"
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FbaVxKiTj6Wb3kBUXI8fHF6ajq/0bfb6aed-c30f-4b08-ab75-c7b6aaab476a.mp3' -o "$source_dir/Morning Light.wav"
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FbaVxKiTj6Wb3kBUXI8fHF6ajq/a41cda81-fa2a-42b4-944f-e67ac5c4ae3e.mp3' -o "$source_dir/Morning Pulse.wav"
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FbaVxKiTj6Wb3kBUXI8fHF6ajq/0a8eb82a-347f-46e6-b2b7-5df88898bf4b.mp3' -o "$source_dir/Soft Start.wav"

          echo "b3d3c235a8b20257b61d802f0932dea8ebc5ccabd014137559f0e86ecba84afb  $source_dir/Morning Light.wav" | sha256sum -c -
          echo "9ee88e3cc20cc3de6e3dafa470b4c0199dde052d7aaaab1ec8e78864b06436f4  $source_dir/Morning Pulse.wav" | sha256sum -c -
          echo "a7303436557685ebd90456746ccc58dbe2e16f35f8e06b89af39c518d436d16b  $source_dir/Soft Start.wav" | sha256sum -c -
          test "$(stat -c%s "$source_dir/Morning Light.wav")" -eq 11510804
          test "$(stat -c%s "$source_dir/Morning Pulse.wav")" -eq 11503124
          test "$(stat -c%s "$source_dir/Soft Start.wav")" -eq 6111764

          cd apps/android
          python scripts/wake_sound_assets.py --import "$source_dir"
          rm -f app/src/main/res/raw/morning_light.ogg \
                app/src/main/res/raw/morning_pulse.ogg \
                app/src/main/res/raw/soft_start.ogg
          python scripts/wake_sound_assets.py --check

      - name: Commit exact WAV bundle and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/android/app/src/main/res/raw apps/android/app/src/main/wake-sound-assets.json
          if git diff --cached --quiet; then
            echo 'Approved wake masters are already bundled exactly.'
            exit 0
          fi
          git commit -m 'Bundle full-length branded wake sound masters'
          git push origin HEAD:feature/branded-wake-sounds-v2
