name: Import branded wake sounds

on:
  push:
    branches:
      - feature/branded-wake-sounds-v2
    paths:
      - ".github/workflows/import-branded-wake-sounds.yml"

permissions:
  contents: write

jobs:
  import-sounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/branded-wake-sounds-v2
          fetch-depth: 0

      - name: Fetch exact Suno sources and package app assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/android/app/src/main/res/raw "$RUNNER_TEMP/wmw-audio"

          fetch_and_encode() {
            local clip_id="$1"
            local output_name="$2"
            local input="$RUNNER_TEMP/wmw-audio/${output_name}.source"
            local output="apps/android/app/src/main/res/raw/${output_name}.ogg"
            local metadata="$RUNNER_TEMP/wmw-audio/${output_name}.json"

            curl --fail --silent --show-error --location --retry 3 \
              -H 'Accept: application/json' \
              "https://studio-api-prod.suno.com/api/clip/${clip_id}" \
              -o "$metadata"

            local audio_url
            audio_url="$(python3 - "$metadata" <<'PY'
import json, sys
with open(sys.argv[1], 'r', encoding='utf-8') as f:
    data = json.load(f)
urls = data.get('media_urls') or []
preferred = None
for content_type in ('m4a-opus', 'mp3'):
    preferred = next((item.get('url') for item in urls if item.get('content_type') == content_type and item.get('url')), None)
    if preferred:
        break
print(preferred or data.get('audio_url') or '')
PY
)"

            if [[ -z "$audio_url" || "$audio_url" == *"/api/forbidden"* ]]; then
              audio_url="https://cdn1.suno.ai/${clip_id}.mp3"
            fi

            curl --fail --silent --show-error --location --retry 3 \
              -H 'Referer: https://suno.com/' \
              -H 'User-Agent: Mozilla/5.0 WakeMyWayAssetImporter/1.0' \
              "$audio_url" \
              -o "$input"

            ffprobe -v error "$input"
            ffmpeg -hide_banner -loglevel error -y \
              -i "$input" \
              -map_metadata 0 \
              -vn \
              -c:a libopus \
              -b:a 96k \
              -vbr on \
              -compression_level 10 \
              -application audio \
              "$output"

            python3 - "$output" <<'PY'
import os, subprocess, sys
path = sys.argv[1]
size = os.path.getsize(path)
if size < 100_000:
    raise SystemExit(f'{path} is unexpectedly small: {size} bytes')
duration = float(subprocess.check_output([
    'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
    '-of', 'default=noprint_wrappers=1:nokey=1', path,
], text=True).strip())
if not 25.0 <= duration <= 70.0:
    raise SystemExit(f'{path} has unexpected duration: {duration:.2f}s')
print(f'{path}: {size} bytes, {duration:.2f}s')
PY
          }

          fetch_and_encode '48978004-63ac-4d7f-9368-1ae614870d88' 'morning_light'
          fetch_and_encode '320340bd-207c-416f-a240-5ae0b715e3cf' 'morning_pulse'
          fetch_and_encode 'd76c102f-ec19-4d1e-b639-2ba126449682' 'soft_start'

      - name: Commit packaged sounds and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-branded-wake-sounds.yml
          git add apps/android/app/src/main/res/raw/morning_light.ogg \
                  apps/android/app/src/main/res/raw/morning_pulse.ogg \
                  apps/android/app/src/main/res/raw/soft_start.ogg
          git commit -m 'Bundle branded wake sound assets'
          git push origin HEAD:feature/branded-wake-sounds-v2
