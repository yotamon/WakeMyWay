name: Import branded wake sounds

on:
  push:
    branches:
      - feature/branded-wake-sounds-v2
    paths:
      - ".github/workflows/import-branded-wake-sounds.yml"

permissions:
  contents: write

jobs:
  import-sounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/branded-wake-sounds-v2
          fetch-depth: 0

      - name: Fetch exact Suno MP3 sources and package app assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/android/app/src/main/res/raw "$RUNNER_TEMP/wmw-audio"

          fetch_sound() {
            local clip_id="$1"
            local output_name="$2"
            local metadata="$RUNNER_TEMP/wmw-audio/${output_name}.json"
            local output="apps/android/app/src/main/res/raw/${output_name}.mp3"

            curl --fail --silent --show-error --location --retry 3 \
              -H 'Accept: application/json' \
              "https://studio-api-prod.suno.com/api/clip/${clip_id}" \
              -o "$metadata"

            local audio_url
            audio_url="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); direct=d.get("audio_url") or ""; media=d.get("media_urls") or []; mp3=next((x.get("url") for x in media if x.get("content_type")=="mp3" and x.get("url")), ""); print(direct if direct and "/api/forbidden" not in direct else (mp3 or ""))' "$metadata")"
            if [[ -z "$audio_url" ]]; then
              audio_url="https://cdn1.suno.ai/${clip_id}.mp3"
            fi

            curl --fail --silent --show-error --location --retry 3 \
              -H 'Referer: https://suno.com/' \
              -H 'User-Agent: Mozilla/5.0 WakeMyWayAssetImporter/1.0' \
              "$audio_url" \
              -o "$output"

            python3 -c 'import json,os,sys; p,m=sys.argv[1:3]; size=os.path.getsize(p); head=open(p,"rb").read(3); d=json.load(open(m,encoding="utf-8")); duration=float((d.get("metadata") or {}).get("duration") or 0); assert size>=100000, f"{p} is unexpectedly small: {size} bytes"; assert head==b"ID3" or (len(head)>=2 and head[0]==255 and head[1]&224==224), f"{p} is not an MP3 payload"; assert 25<=duration<=70, f"{p} has unexpected source duration: {duration:.2f}s"; print(f"{p}: {size} bytes, source {duration:.2f}s")' "$output" "$metadata"
          }

          fetch_sound '48978004-63ac-4d7f-9368-1ae614870d88' 'morning_light'
          fetch_sound '320340bd-207c-416f-a240-5ae0b715e3cf' 'morning_pulse'
          fetch_sound 'd76c102f-ec19-4d1e-b639-2ba126449682' 'soft_start'

      - name: Commit packaged sounds and remove one-shot importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/import-branded-wake-sounds.yml
          git add apps/android/app/src/main/res/raw/morning_light.mp3 \
                  apps/android/app/src/main/res/raw/morning_pulse.mp3 \
                  apps/android/app/src/main/res/raw/soft_start.mp3
          git commit -m 'Bundle branded wake sound assets'
          git push origin HEAD:feature/branded-wake-sounds-v2
