name: Android CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "README.md"
      - "tooling/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "README.md"
      - "tooling/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate documentation
        run: python tooling/check_docs.py

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"
      - name: Install Android 17 SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v5
      - name: Test wake-core
        run: ./gradlew :wake-core:test --stacktrace
      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wake-my-way-debug-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: wake-my-way-androidTest-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
