name: Android CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/actions/setup-android/**"
      - ".github/workflows/android-release.yml"
      - "tooling/android_release_plan.py"
      - "tooling/test_android_release_plan.py"
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/actions/setup-android/**"
      - ".github/workflows/android-release.yml"
      - "tooling/android_release_plan.py"
      - "tooling/test_android_release_plan.py"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - name: Set up Android build environment
        uses: ./.github/actions/setup-android
        with:
          python-version: "3.13"
      - name: Test release planning utility
        run: python ../../tooling/test_android_release_plan.py
      - name: Test branded wake-sound asset tooling
        run: python scripts/test_wake_sound_assets.py
      - name: Verify branded wake-sound asset bundle
        run: python scripts/wake_sound_assets.py --check
      - name: Test wake-core
        run: ./gradlew :wake-core:test --stacktrace
      - name: Test Android app unit logic
        run: ./gradlew :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest --stacktrace
      - name: Android lint
        shell: bash
        run: |
          mkdir -p app/build/reports
          set -o pipefail
          ./gradlew :app:lintDirectDebug --stacktrace 2>&1 | tee app/build/reports/lint-ci.log
      - name: Upload lint diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: wake-my-way-lint-${{ github.sha }}
          path: |
            apps/android/app/build/reports/lint-ci.log
            apps/android/app/build/reports/lint-results-directDebug.txt
            apps/android/app/build/reports/lint-results-debug.html
            apps/android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile instrumentation tests
        run: ./gradlew :app:assembleDirectDebugAndroidTest --stacktrace
      - name: Assemble direct debug APK
        run: ./gradlew :app:assembleDirectDebug --stacktrace
      - name: Compile Play distribution
        run: ./gradlew :app:assemblePlayDebug --stacktrace
      - name: Compile release-performance benchmark
        run: ./gradlew :benchmark:assemblePlayBenchmark --stacktrace
      - name: Upload debug APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: wake-my-way-debug-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/direct/debug/app-direct-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload instrumentation APK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: wake-my-way-androidTest-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/androidTest/direct/debug/app-direct-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
