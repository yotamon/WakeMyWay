name: Import full-length branded wake sounds

on:
  push:
    branches:
      - "feature/branded-wake-sounds-v2"
    paths:
      - ".github/workflows/import-full-length-wake-sounds.yml"

permissions:
  contents: write

jobs:
  import-sounds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/branded-wake-sounds-v2
          fetch-depth: 0

      - name: Download and verify full-length audio
        shell: bash
        run: |
          set -euo pipefail
          raw_dir="apps/android/app/src/main/res/raw"
          mkdir -p "$raw_dir"

          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FbaVxKiTj6Wb3kBUXI8fHF6ajq/2fbe924f-bab1-4205-a28a-075c333266ae.mp3' -o "$raw_dir/morning_light.ogg"
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FbaVxKiTj6Wb3kBUXI8fHF6ajq/392c8d1c-45d0-4797-9b3b-e465dca31ff1.mp3' -o "$raw_dir/morning_pulse.ogg"
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3FbaVxKiTj6Wb3kBUXI8fHF6ajq/b267d925-3e57-478d-893e-cdf809bb4ba4.mp3' -o "$raw_dir/soft_start.ogg"

          echo '869d066becb382d26328ee84263b9c768ccc2766c07e0e031d6804e0cefb0056  apps/android/app/src/main/res/raw/morning_light.ogg' | sha256sum -c -
          echo '2fea6340b13164f2ec9c4d279e739ddf0722a696a7e0aed37cb8fb911074f85c  apps/android/app/src/main/res/raw/morning_pulse.ogg' | sha256sum -c -
          echo '0da01d81bf1ee3f354a07a8f9994b2f986f1c166537453a5914e8da8b58006df  apps/android/app/src/main/res/raw/soft_start.ogg' | sha256sum -c -

          test "$(stat -c%s "$raw_dir/morning_light.ogg")" -eq 834500
          test "$(stat -c%s "$raw_dir/morning_pulse.ogg")" -eq 879574
          test "$(stat -c%s "$raw_dir/soft_start.ogg")" -eq 463557

      - name: Commit full-length packaged sounds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/android/app/src/main/res/raw/morning_light.ogg \
                  apps/android/app/src/main/res/raw/morning_pulse.ogg \
                  apps/android/app/src/main/res/raw/soft_start.ogg
          if git diff --cached --quiet; then
            echo 'Audio assets already match expected full-length files.'
            exit 0
          fi
          git commit -m 'Use full-length branded wake sounds'
          git push origin HEAD:feature/branded-wake-sounds-v2
