name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "README.md"
      - "tooling/check_docs.py"
      - "tooling/physical-reliability.ps1"
      - "tooling/test_physical_reliability_privacy.py"
      - ".gitignore"
      - ".github/workflows/docs-ci.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "README.md"
      - "tooling/check_docs.py"
      - "tooling/physical-reliability.ps1"
      - "tooling/test_physical_reliability_privacy.py"
      - ".gitignore"
      - ".github/workflows/docs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate documentation
        run: python tooling/check_docs.py
      - name: Validate local device evidence privacy defaults
        run: python tooling/test_physical_reliability_privacy.py
