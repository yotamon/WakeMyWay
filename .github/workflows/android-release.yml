name: Android Play Release Bundle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Public version name, e.g. 0.1.0"
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: "Monotonically increasing Play version code"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      WMW_VERSION_NAME: ${{ inputs.version_name }}
      WMW_VERSION_CODE: ${{ inputs.version_code }}
      WMW_RELEASE_STORE_PASSWORD: ${{ secrets.WMW_RELEASE_STORE_PASSWORD }}
      WMW_RELEASE_KEY_ALIAS: ${{ secrets.WMW_RELEASE_KEY_ALIAS }}
      WMW_RELEASE_KEY_PASSWORD: ${{ secrets.WMW_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: "false"

      - name: Install Android 17 SDK
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v5

      - name: Validate release signing secrets
        env:
          WMW_RELEASE_KEYSTORE_BASE64: ${{ secrets.WMW_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in \
            WMW_RELEASE_KEYSTORE_BASE64 \
            WMW_RELEASE_STORE_PASSWORD \
            WMW_RELEASE_KEY_ALIAS \
            WMW_RELEASE_KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required GitHub Actions secret: ${variable}" >&2
              exit 1
            fi
          done

      - name: Materialize release keystore
        env:
          WMW_RELEASE_KEYSTORE_BASE64: ${{ secrets.WMW_RELEASE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/wake-my-way-release.jks"
          printf '%s' "$WMW_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "WMW_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test wake-core
        run: ./gradlew :wake-core:test --stacktrace

      - name: Test Android app unit logic
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint release variant
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Build signed Play bundle
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify AAB signature
        shell: bash
        run: jarsigner -verify -strict -certs app/build/outputs/bundle/release/app-release.aab

      - name: Generate release checksum
        shell: bash
        run: sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: wake-my-way-play-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/bundle/release/app-release.aab.sha256
            apps/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove materialized keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "${RUNNER_TEMP}/wake-my-way-release.jks"
